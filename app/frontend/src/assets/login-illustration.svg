<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book -->
  <rect x="100" y="80" width="200" height="150" rx="5" fill="#fff" opacity="0.9"/>
  <rect x="100" y="80" width="100" height="150" rx="5" fill="#f0f0f0"/>
  <line x1="200" y1="80" x2="200" y2="230" stroke="#ddd" stroke-width="2"/>

  <!-- Lines on book -->
  <line x1="120" y1="110" x2="180" y2="110" stroke="#ccc" stroke-width="2"/>
  <line x1="120" y1="130" x2="170" y2="130" stroke="#ccc" stroke-width="2"/>
  <line x1="120" y1="150" x2="175" y2="150" stroke="#ccc" stroke-width="2"/>
  <line x1="120" y1="170" x2="165" y2="170" stroke="#ccc" stroke-width="2"/>

  <line x1="220" y1="110" x2="280" y2="110" stroke="#ccc" stroke-width="2"/>
  <line x1="220" y1="130" x2="275" y2="130" stroke="#ccc" stroke-width="2"/>
  <line x1="220" y1="150" x2="270" y2="150" stroke="#ccc" stroke-width="2"/>
  <line x1="220" y1="170" x2="260" y2="170" stroke="#ccc" stroke-width="2"/>

  <!-- Graduation cap -->
  <polygon points="200,40 140,70 200,100 260,70" fill="url(#grad1)"/>
  <rect x="190" y="30" width="20" height="15" fill="url(#grad1)"/>
  <line x1="260" y1="70" x2="270" y2="90" stroke="url(#grad1)" stroke-width="3"/>
  <circle cx="270" cy="95" r="5" fill="#ffd700"/>

  <!-- Stars -->
  <circle cx="80" cy="60" r="3" fill="#ffd700"/>
  <circle cx="320" cy="80" r="4" fill="#ffd700"/>
  <circle cx="340" cy="150" r="3" fill="#ffd700"/>
  <circle cx="60" cy="180" r="4" fill="#ffd700"/>

  <!-- ABC letters -->
  <text x="50" y="250" font-family="Arial" font-size="24" font-weight="bold" fill="url(#grad1)" opacity="0.6">A</text>
  <text x="180" y="270" font-family="Arial" font-size="24" font-weight="bold" fill="url(#grad1)" opacity="0.6">B</text>
  <text x="320" y="250" font-family="Arial" font-size="24" font-weight="bold" fill="url(#grad1)" opacity="0.6">C</text>
</svg>
